name: Build ESP8266 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.ino"
      - "tools/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "**.ino"
      - "tools/**"
      - ".github/workflows/build.yml"

concurrency:
  group: firmware-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARDUINO_CORE_VERSION: "3.1.2"
  FIRMWARE_VERSION: "8.0.26"
  SKETCH_SOURCE: ESP8266_SmallTV_Pro_V8_0_15_Full_Audit_Fix.ino
  SKETCH_DIR: SmallTV

jobs:
  build:
    name: Compile ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - eesz: 4M2M
            label: 4MB-FS2MB
          - eesz: 4M1M
            label: 4MB-FS1MB

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply deterministic V8.0.26 patch
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            tools/apply_v8_0_24_smart_status.py \
            tools/apply_v8_0_25_animated_mochi.py \
            tools/apply_v8_0_26_ota_and_partial_refresh.py
          python3 tools/apply_v8_0_26_ota_and_partial_refresh.py
          test -s "${SKETCH_SOURCE}"
          grep -F 'static const char* FW_VERSION = "8.0.26";' "${SKETCH_SOURCE}"
          grep -F 'void refreshVisibleWeatherUi()' "${SKETCH_SOURCE}"
          grep -F 'SmallTV firmware V' "${SKETCH_SOURCE}"
          grep -F 'ESP.getFreeSketchSpace()' "${SKETCH_SOURCE}"
          grep -F 'no-store, no-cache, must-revalidate, max-age=0' "${SKETCH_SOURCE}"
          grep -F 'const unsigned long MOCHI_FRAME_INTERVAL_MS = 50UL;' "${SKETCH_SOURCE}"

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp8266-${{ runner.os }}-${{ env.ARDUINO_CORE_VERSION }}

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          set -euxo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install "esp8266:esp8266@${ARDUINO_CORE_VERSION}"

      - name: Prepare sketch folder
        run: |
          set -euxo pipefail
          rm -rf "${SKETCH_DIR}" build
          mkdir -p "${SKETCH_DIR}" build
          cp "${SKETCH_SOURCE}" "${SKETCH_DIR}/${SKETCH_DIR}.ino"

      - name: Compile firmware
        run: |
          set -euxo pipefail
          arduino-cli compile \
            --fqbn "esp8266:esp8266:generic:eesz=${{ matrix.eesz }},FlashMode=dio" \
            --warnings all \
            --export-binaries \
            --output-dir build \
            "${SKETCH_DIR}"

      - name: Package and inspect firmware
        run: |
          set -euxo pipefail
          test -f "build/${SKETCH_DIR}.ino.bin"
          OUT="build/SmallTV_V${FIRMWARE_VERSION//./_}_${{ matrix.eesz }}.bin"
          cp "build/${SKETCH_DIR}.ino.bin" "${OUT}"
          test "$(stat -c%s "${OUT}")" -gt 100000
          strings "${OUT}" | grep -F '8.0.26'
          sha256sum "${OUT}" > "${OUT}.sha256"
          cp "${SKETCH_SOURCE}" "build/SmallTV_V${FIRMWARE_VERSION//./_}_${{ matrix.eesz }}.ino"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTV-V${{ env.FIRMWARE_VERSION }}-${{ matrix.label }}
          path: |
            build/SmallTV_V*.bin
            build/SmallTV_V*.sha256
            build/SmallTV_V*.ino
          if-no-files-found: error
          retention-days: 30
