name: Build ESP8266 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Prepare sketch folder
        run: |
          mkdir -p SmallTV
          cp ESP8266_SmallTV_Pro_V8_0_2_UTF8_Location_Fix.ino SmallTV/SmallTV.ino
      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "ArduinoJson"

      - name: Compile firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic:eesz=4M2M,FlashMode=dio \
            --output-dir build \
            SmallTV

      - name: Rename firmware
        run: |
          cp build/SmallTV.ino.bin build/SmallTV_V8_0_0.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTV-Firmware
          path: build/SmallTV_V8_0_0.bin
