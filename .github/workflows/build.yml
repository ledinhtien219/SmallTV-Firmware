name: Build ESP8266 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.ino"
      - "tools/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "**.ino"
      - "tools/**"
      - ".github/workflows/build.yml"

concurrency:
  group: firmware-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ARDUINO_CORE_VERSION: "3.1.2"
  FIRMWARE_VERSION: "8.0.18"
  SKETCH_SOURCE: ESP8266_SmallTV_Pro_V8_0_15_Full_Audit_Fix.ino
  SKETCH_DIR: SmallTV
  BUILD_DIR: build

jobs:
  build:
    name: Compile ESP8266 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply smooth rendering changes
        run: |
          python3 tools/apply_v8_0_18_smooth_pages.py
          grep -F 'static const char* FW_VERSION = "8.0.18";' "${SKETCH_SOURCE}"
          grep -F 'void animatePageTransition()' "${SKETCH_SOURCE}"
          grep -F 'SPI.setFrequency(16000000)' "${SKETCH_SOURCE}"
          grep -F 'drawPageActivityPulse();' "${SKETCH_SOURCE}"

      - name: Commit materialized V8.0.18 source
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- "${SKETCH_SOURCE}"; then
            echo "Firmware source is already V8.0.18."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${SKETCH_SOURCE}"
            git commit -m "Materialize smooth SmallTV firmware V8.0.18"
            git push origin HEAD:main
          fi

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp8266-${{ runner.os }}-${{ env.ARDUINO_CORE_VERSION }}

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install "esp8266:esp8266@${ARDUINO_CORE_VERSION}"

      - name: Prepare sketch folder
        run: |
          mkdir -p "${SKETCH_DIR}"
          cp "${SKETCH_SOURCE}" "${SKETCH_DIR}/${SKETCH_DIR}.ino"

      - name: Compile firmware
        run: |
          mkdir -p "${BUILD_DIR}"
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic:eesz=4M2M,FlashMode=dio \
            --warnings all \
            --export-binaries \
            --output-dir "${BUILD_DIR}" \
            "${SKETCH_DIR}"

      - name: Package firmware
        run: |
          cp "${BUILD_DIR}/${SKETCH_DIR}.ino.bin" \
            "${BUILD_DIR}/SmallTV_V${FIRMWARE_VERSION//./_}.bin"
          sha256sum "${BUILD_DIR}/SmallTV_V${FIRMWARE_VERSION//./_}.bin" \
            > "${BUILD_DIR}/SmallTV_V${FIRMWARE_VERSION//./_}.sha256"
          cp "${SKETCH_SOURCE}" "${BUILD_DIR}/SmallTV_V${FIRMWARE_VERSION//./_}.ino"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTV-Firmware-V${{ env.FIRMWARE_VERSION }}-smooth
          path: |
            build/SmallTV_V*.bin
            build/SmallTV_V*.sha256
            build/SmallTV_V*.ino
          if-no-files-found: error
          retention-days: 30
