name: Build ESP8266 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.ino"
      - "tools/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "**.ino"
      - "tools/**"
      - ".github/workflows/build.yml"

concurrency:
  group: firmware-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARDUINO_CORE_VERSION: "3.1.2"
  FIRMWARE_VERSION: "8.0.24"
  SKETCH_SOURCE: ESP8266_SmallTV_Pro_V8_0_15_Full_Audit_Fix.ino
  SKETCH_DIR: SmallTV
  BUILD_DIR: build

jobs:
  build:
    name: Compile ESP8266 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply deterministic V8.0.24 patch
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            tools/apply_v8_0_19_form_input_lock.py \
            tools/apply_v8_0_20_clock_lunar_and_form_lock.py \
            tools/apply_v8_0_21_weather_icon_cleanup.py \
            tools/apply_v8_0_22_split_calendar.py \
            tools/apply_v8_0_23_web_flash_fix.py \
            tools/apply_v8_0_24_smart_status.py
          python3 tools/apply_v8_0_24_smart_status.py
          test -s "${SKETCH_SOURCE}"
          grep -F 'static const char* FW_VERSION = "8.0.24";' "${SKETCH_SOURCE}"
          grep -F 'const char* mobileAppPage() {' "${SKETCH_SOURCE}"
          grep -F 'server.send_P(200, PSTR("text/html; charset=utf-8"), mobileAppPage());' "${SKETCH_SOURCE}"
          grep -F 'function weatherIconFor(' "${SKETCH_SOURCE}"
          grep -F 'function renderWeatherAlert(' "${SKETCH_SOURCE}"
          grep -F 'id="weatherAlert"' "${SKETCH_SOURCE}"

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp8266-${{ runner.os }}-${{ env.ARDUINO_CORE_VERSION }}

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          set -euxo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install "esp8266:esp8266@${ARDUINO_CORE_VERSION}"

      - name: Prepare sketch folder
        run: |
          set -euxo pipefail
          rm -rf "${SKETCH_DIR}" "${BUILD_DIR}"
          mkdir -p "${SKETCH_DIR}" "${BUILD_DIR}"
          cp "${SKETCH_SOURCE}" "${SKETCH_DIR}/${SKETCH_DIR}.ino"

      - name: Compile firmware
        run: |
          set -euxo pipefail
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic:eesz=4M2M,FlashMode=dio \
            --warnings all \
            --export-binaries \
            --output-dir "${BUILD_DIR}" \
            "${SKETCH_DIR}"

      - name: Package firmware
        run: |
          set -euxo pipefail
          test -f "${BUILD_DIR}/${SKETCH_DIR}.ino.bin"
          cp "${BUILD_DIR}/${SKETCH_DIR}.ino.bin" \
            "${BUILD_DIR}/SmallTV_V${FIRMWARE_VERSION//./_}.bin"
          sha256sum "${BUILD_DIR}/SmallTV_V${FIRMWARE_VERSION//./_}.bin" \
            > "${BUILD_DIR}/SmallTV_V${FIRMWARE_VERSION//./_}.sha256"
          cp "${SKETCH_SOURCE}" "${BUILD_DIR}/SmallTV_V${FIRMWARE_VERSION//./_}.ino"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTV-Firmware-V${{ env.FIRMWARE_VERSION }}-smart-status
          path: |
            build/SmallTV_V*.bin
            build/SmallTV_V*.sha256
            build/SmallTV_V*.ino
          if-no-files-found: error
          retention-days: 30
